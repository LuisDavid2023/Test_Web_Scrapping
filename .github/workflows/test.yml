name: Producción - Drayage Scraper Diario (Windows)

on:
  schedule:
    - cron: '0 10 * * 1-5' # Ejecución automática de lunes a viernes a las 5:00 a.m. hora de Colombia (10:00 UTC)
  workflow_dispatch:       # Permite realizar pruebas manuales bajo demanda desde la interfaz de GitHub

jobs:
  scraper-windows-nube:
    runs-on: windows-latest # Ejecutor Windows para garantizar la resolución autónoma del WAF de Cloudflare

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install selenium beautifulsoup4 undetected-chromedriver

      - name: Ejecutar Scraper Autónomo por Lotes
        run: python scrapper.py